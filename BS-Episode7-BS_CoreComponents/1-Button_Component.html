<html>

<head>
    <title> BS Buttons </title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container">

    <h5> Button - standard </h5>
    <button> Validate </button>

    <h5> Button - with BS </h5>
    <button class="btn border-1"> Validate </button>

    <h5> Button - with BS/Primary color </h5>
    <button class="btn btn-primary"> Validate </button> 

    <h5> Button - with BS/Primary color & Padding </h5>
    <button class="btn btn-primary p-3"> Submit </button> 

</body>
