<html>

<head>
    <title> JS Components - Modal </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="container-fluid">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#mymodal"> Modal </button>
        </div>

        <div class="container">
        <div class="modal" id="mymodal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header"> Header Content
                        <button class="btn btn-close text-danger" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body"> Body Content </div>
                    <div class="modal-footer">
                        <button class="btn btn-primary"> submit </button>
                        <button class="btn btn-danger" data-bs-dismiss="modal"> Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
