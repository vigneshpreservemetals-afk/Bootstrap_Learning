<html>

<head>
    <title>BS forms - validation </title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="h3 text-white bg-primary p-2"> Basic Forms - Proper Validations </div>

    <div class="container">

        <form class="needs-validation" novalidate>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" required>
                <div class="invalid-feedback">
                    Please enter a valid email.
                </div>
            </div>

            <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" required minLength="3" maxlength="5">
                <div class="invalid-feedback">
                    Please provide a password between 5 to 8 characters.
                </div>
            </div>

            <button class="btn btn-primary mt-3">Submit</button>

        </form>
    </div>

    </form>

    <script>

        (() => {
            'use strict';
            const forms = document.querySelectorAll('.needs-validation');

            forms.forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    event.preventDefault();
                    form.classList.add('was-validated');
                });
            });
        })();

    </script>

</body>

</html>
