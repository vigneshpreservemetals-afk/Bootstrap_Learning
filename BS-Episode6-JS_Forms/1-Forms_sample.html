<html>

<head>
    <title> JS Components - Forms </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="h3 text-white bg-primary"> Basic Forms - Sample </div>

    

        <form>

        <div class="container"> 

        <div>
            <label for="firstname" class="form-label mt-3"> Candidate First Name <span class="text-danger"> * </span></label>
            <input type="text" class="form-control" id="firstname" >
        </div>

        <div>
            <label for="lastname" class="form-label mt-3"> Candidate Last Name <span class="text-danger"> * </span></label>
            <input type="text" class="form-control" id="lastname" >
        </div>

        
        <div>
            <label for="password" class="form-label mt-3"> Password <span class="text-danger"> * </span></label>
            <input type="password" class="form-control" id="password" >
        </div>
        

        <div>

        <label for="radio" class="form-check-label mt-3"> Gender <span class="text-danger"> * </span></label>
    
        <div class="form-check form-check-inline">
        <input type="radio" class="form-check-input" id="male" name="gender">
        <label for="male" class="form-check-label"> Male </label>
        </div>

        <div class="form-check form-check-inline">
        <input type="radio" class="form-check-input" id="Female" name="gender">
        <label for="female" class="form-check-label"> Female </label>
        </div>


        <div>

        <label for="checkbox" class="form-check-label mt-3"> Language <span class="text-danger"> * </span></label>
    
        <div class="form-check form-check-inline">
        <input type="checkbox" class="form-check-input" id="Tamil" name="Language">
        <label for="Tamil" class="form-check-label"> Tamil </label>
        </div>

        <div class="form-check form-check-inline">
        <input type="checkbox" class="form-check-input" id="English" name="Language">
        <label for="English" class="form-check-label"> English </label>
        </div>

        <div class="form-check form-check-inline">
        <input type="checkbox" class="form-check-input" id="sanskrit" name="Language">
        <label for="sanskrit" class="form-check-label"> Sanskrit </label>
        </div>
        
        <div class="mt-3">
            <button class="btn btn-primary text-white" id="submit"> Submit </button>
            <button class="btn btn-danger"> Cancel </button>
        </div>

        </div>

        </form>

    </div>
    </div>

   

   

   
            
        </div>

            </div>
        </div>
    </div>
</body>
