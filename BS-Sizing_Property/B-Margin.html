<!DOCTYPE html>
<html>
<head>
    <title> Margin Property </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container ">
         <div class="border border-primary mt-5"> Top spacing</div>
    </div>
    
    <div class="container-fluid mt-5">
         <div class="border border-primary ms-3 "> Start</div>
    </div>

     <div class="container-fluid mt-5 me-5">
         <div class=" border border-primary me-5"> End </div>
    </div>

 
    <div class="container-fluid mt-5 ">
         <div class="border border-danger mx-4"> Left & Right </div>
    </div>
     
   
    <div class="container-fluid border border-primary mt-5">
         <div class="border my-5"> top and Bottom</div>
    </div>
